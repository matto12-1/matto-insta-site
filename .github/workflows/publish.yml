# 매일 올리기. 원본은 비공개 저장소 MattoInsta의 site/.github/workflows/publish.yml (여기 고치면 다음 달 올릴 때 덮인다).
# 깃허브 예약은 20~50분씩 밀리기도 하고 가끔 빠진다 → 정각 1시간 반 전부터 20분 간격으로 세 번 깨우고,
# 먼저 깬 작업이 준비물을 만들어 둔 채 정각까지 기다렸다가 올린다. 뒤에 깬 작업은 차례를 기다렸다가 「이미 올림」을 보고 끝난다.
# 멈추려면: 저장소 Settings → Variables → PAUSE = 1
name: publish
on:
  schedule:
    - cron: "3,23,43 21 * * 0-4" # 한국 시각 월~금 06:03 · 06:23 · 06:43 → 07:30 아침 글
    - cron: "33,53 9 * * 1-4" # 한국 시각 월~목 18:33 · 18:53 → 20:00 저녁 글
    - cron: "13 10 * * 1-4" # 한국 시각 월~목 19:13
  workflow_dispatch:
    inputs:
      id:
        description: "이 편만 바로 올린다(예: 2026-11-02-am). 비우면 지금 시각에 맞는 편"
        required: false
        default: ""
      dry:
        description: "준비물만 만들고 올리지 않는다(미리 해 보기)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: vars.PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # 예약 작업은 깬 순간의 커밋을 받는다 → 차례를 기다린 작업이 앞 작업의 올리기 기록을 못 본다.
      # 그래서 차례가 온 뒤 main 끝을 새로 받는다(기록 확인 + 최근 게시물 본문 확인, 두 겹)
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: main 끝으로
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올리기
        id: cards
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          IN_ID: ${{ inputs.id }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          set --
          if [ -n "$IN_ID" ]; then set -- "$@" --id "$IN_ID"; fi
          if [ "$IN_DRY" = "true" ]; then node scripts/reel-dry.mjs "$@"; exit $?; fi
          node scripts/publish.mjs "$@"
      - name: 기록 남기기
        id: card_records
        if: always() && inputs.dry != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "state: 올리기 기록"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then exit 0; fi
            # 같은 파일을 다른 작업이 먼저 적었으면 다시 맞추기가 멈춘다 → 조용히 넘어가지 않고 실패로 끝낸다
            if ! git pull -q --rebase origin main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
      - name: 릴 이어 올리기
        id: reels
        if: "always() && vars.PAUSE != '1' && ((inputs.dry == true) || (steps.cards.outcome == 'success' && steps.card_records.outcome == 'success' && vars.REELS_ENABLED == '1'))"
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REELS_ENABLED: ${{ vars.REELS_ENABLED }}
          PAUSE: ${{ vars.PAUSE }}
          IN_ID: ${{ inputs.id }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          set --
          if [ -n "$IN_ID" ]; then set -- "$@" --id "$IN_ID"; fi
          if [ "$IN_DRY" = "true" ]; then set -- "$@" --dry; fi
          node scripts/reel.mjs "$@"
      - name: 릴 기록 남기기
        if: always() && steps.reels.outcome != 'skipped' && inputs.dry != true
        continue-on-error: true
        run: |
          if [ ! -d state/reels ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/reels
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "state: 릴 올리기 기록"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then exit 0; fi
            if ! git pull -q --rebase origin main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
